name: Publish root homologation images to GHCR

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hml-root-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth
            context: evo-auth-service-community
            dockerfile: evo-auth-service-community/Dockerfile
          - component: bot-runtime
            context: evo-bot-runtime
            dockerfile: evo-bot-runtime/Dockerfile
          - component: flow
            context: evo-flow-community
            dockerfile: evo-flow-community/Dockerfile
          - component: evolution-api
            context: evolution-api
            dockerfile: evolution-api/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - name: Checkout only this public build context
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          git submodule sync -- "$CONTEXT"
          git submodule update --init -- "$CONTEXT"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable root commit tag
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/jeduardocampos10/artgenial-hml-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=hml-${{ matrix.component }}-amd64
          cache-to: type=gha,scope=hml-${{ matrix.component }}-amd64,mode=max
