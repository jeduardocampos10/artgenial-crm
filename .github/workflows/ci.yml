name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARTGENIAL_SUBMODULES_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARTGENIAL_SUBMODULES_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Lint Auth Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-auth-service-community/Dockerfile
          failure-threshold: error

      - name: Lint CRM Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-crm-community/docker/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-frontend-community/Dockerfile
          failure-threshold: error

      - name: Lint Processor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-processor-community/Dockerfile
          failure-threshold: error

      - name: Lint Core Service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-core-service-community/Dockerfile
          failure-threshold: error

  check-migration-collision:
    name: Check Migration Version Collision (CRM vs auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARTGENIAL_SUBMODULES_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Run migration collision guard
        run: ./scripts/check_migration_collision.sh

  validate-evolution-api:
    name: Validate hardened Evolution API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evolution-api
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARTGENIAL_SUBMODULES_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: evolution-api/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Check linting
        run: npm run lint:check

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://user:pass@localhost:5432/evolution?schema=public

      - name: Check build
        run: npm run build
